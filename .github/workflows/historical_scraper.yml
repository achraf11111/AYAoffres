name: Historical Tender Scraper

on:
  schedule:
    # Run every 4 hours (e.g., 00:00, 04:00, 08:00...)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  scrape-history:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max limit is 360, we stop safely before it kills the job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Historical Scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/historical_scraper.js
